baseURL = 'https://fekomninakis-3f25b.web.app/'
languageCode = 'pt-BR'
title = "fekomninakis"
theme = "mana"

# Theme configuration
[params]
  description = "Blog pessoal de Felipe Komninakis sobre tecnologia, infraestrutura e desenvolvimento"
  author = "Felipe Komninakis"
  heroTitleLine1 = "FELIPE KOMNINAKIS"
  heroTitleLine2 = "Tech Blog"

  # Social media links
  [params.social]
    github = "https://github.com/fekom"
    linkedin = "https://www.linkedin.com/in/fekomninakis"
    email = "fekomninakis@gmail.com"

  # Info for the copyright notice in the footer.
  [params.copyright]
    startYear = 2025
    owner = "Felipe Komninakis"

  # Footer text
  footerText = "Built with Hugo and Mana theme"

  # Code syntax highlighting themes
  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

# Main menu
[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'Posts'
pageRef = '/posts'
weight = 20

[[menus.main]]
name = 'Certificados'
pageRef = '/certificados'
weight = 30

[[menus.main]]
name = 'Sobre'
url = '/sobre/'
weight = 40

[[menus.main]]
name = 'Tags'
pageRef = '/tags'
weight = 50

# Pagination Configuration
[pagination]
  pageSize = 10

# Table of Contents
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

# Output formats for search index
[outputs]
  home = ["HTML", "JSON"]

# Sitemap configuration for SEO
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"
